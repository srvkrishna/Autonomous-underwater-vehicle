<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e2e" />
      <stop offset="40%" stop-color="#0f2d45" />
      <stop offset="100%" stop-color="#163951" />
    </linearGradient>
    <radialGradient id="acousticGlow" cx="40%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#78c8c2" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#0f2d45" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#091e2e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="contourGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78c8c2" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#78c8c2" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#b9ef1b" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="contourGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d8b87" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#78c8c2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78c8c2" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Deep water column background -->
  <rect width="1000" height="600" fill="url(#oceanBg)" />
  <rect width="1000" height="600" fill="url(#acousticGlow)" />

  <!-- Bathymetric grid -->
  <g stroke="#78c8c2" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="850" y1="0" x2="850" y2="600" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="0" y1="480" x2="1000" y2="480" />
  </g>

  <!-- Concentric sonar wavefronts -->
  <g stroke="#78c8c2" fill="none" opacity="0.35">
    <circle cx="280" cy="300" r="80" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="280" cy="300" r="150" stroke-width="1.2" />
    <circle cx="280" cy="300" r="230" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle cx="280" cy="300" r="320" stroke-width="1.5" />
    <circle cx="280" cy="300" r="420" stroke-width="1.8" />
  </g>

  <!-- Flowing acoustic bathymetry curves -->
  <path d="M 0 460 C 180 430, 320 520, 520 460 C 720 400, 840 450, 1000 420" fill="none" stroke="url(#contourGrad2)" stroke-width="1.5" />
  <path d="M 0 390 C 200 340, 360 440, 580 370 C 780 310, 860 380, 1000 330" fill="none" stroke="url(#contourGrad2)" stroke-width="2" />
  <path d="M 0 320 C 160 260, 340 370, 540 280 C 720 200, 850 290, 1000 240" fill="none" stroke="url(#contourGrad1)" stroke-width="2.5" />
  <path d="M 0 250 C 220 180, 390 280, 600 210 C 780 140, 890 220, 1000 170" fill="none" stroke="url(#contourGrad2)" stroke-width="1.5" />

  <!-- Chirp wave synthesis overlay -->
  <path d="M 120 300 Q 160 270 200 300 T 260 300 T 310 300 T 350 300 T 385 300 T 415 300 T 440 300 T 462 300 T 480 300 T 495 300 T 507 300 T 516 300 T 523 300" 
        fill="none" stroke="#b9ef1b" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Transducer origin marker -->
  <circle cx="280" cy="300" r="6" fill="#b9ef1b" />
  <circle cx="280" cy="300" r="14" fill="none" stroke="#b9ef1b" stroke-width="1.5" opacity="0.75" />
</svg>
