<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193a52" />
      <stop offset="100%" stop-color="#0f2434" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0d2030" />
  
  <!-- Flow lines -->
  <path d="M 170 250 L 250 250" stroke="#78c8c2" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 370 250 L 450 250" stroke="#78c8c2" stroke-width="2" />
  <path d="M 570 250 L 650 250" stroke="#b9ef1b" stroke-width="2" />
  <path d="M 710 200 C 710 100, 110 100, 110 200" fill="none" stroke="#78c8c2" stroke-dasharray="4 4" stroke-width="1.5" />
  <text x="410" y="90" fill="#78c8c2" font-family="monospace" font-size="11" text-anchor="middle">10 Hz ADAPTATION FEEDBACK LOOP</text>

  <!-- Step 1: Environmental Sensing -->
  <g transform="translate(50, 200)">
    <rect width="120" height="100" rx="8" fill="url(#boxGrad)" stroke="#78c8c2" stroke-width="1.5" />
    <text x="60" y="32" fill="#78c8c2" font-family="monospace" font-size="9" text-anchor="middle">STAGE 01</text>
    <text x="60" y="55" fill="#f4f1e9" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">CTD Sensors</text>
    <text x="60" y="75" fill="#88a4aa" font-family="sans-serif" font-size="9" text-anchor="middle">Temp / Salinity</text>
  </g>

  <!-- Step 2: DSP / Sound Speed Profiling -->
  <g transform="translate(250, 200)">
    <rect width="120" height="100" rx="8" fill="url(#boxGrad)" stroke="#78c8c2" stroke-width="1.5" />
    <text x="60" y="32" fill="#78c8c2" font-family="monospace" font-size="9" text-anchor="middle">STAGE 02</text>
    <text x="60" y="55" fill="#f4f1e9" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">ESP32–S3 DSP</text>
    <text x="60" y="75" fill="#88a4aa" font-family="sans-serif" font-size="9" text-anchor="middle">Propagation Calc</text>
  </g>

  <!-- Step 3: Adaptive Waveform Synthesis -->
  <g transform="translate(450, 200)">
    <rect width="120" height="100" rx="8" fill="url(#boxGrad)" stroke="#78c8c2" stroke-width="1.5" />
    <text x="60" y="32" fill="#78c8c2" font-family="monospace" font-size="9" text-anchor="middle">STAGE 03</text>
    <text x="60" y="55" fill="#f4f1e9" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Synthesizer</text>
    <text x="60" y="75" fill="#88a4aa" font-family="sans-serif" font-size="9" text-anchor="middle">LFM Chirp / Costas</text>
  </g>

  <!-- Step 4: Transmit Array -->
  <g transform="translate(650, 200)">
    <rect width="120" height="100" rx="8" fill="url(#boxGrad)" stroke="#b9ef1b" stroke-width="2" />
    <text x="60" y="32" fill="#b9ef1b" font-family="monospace" font-size="9" text-anchor="middle">STAGE 04</text>
    <text x="60" y="55" fill="#f4f1e9" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Piezo PA</text>
    <text x="60" y="75" fill="#b9ef1b" font-family="sans-serif" font-size="9" text-anchor="middle">3.7V Transmit</text>
  </g>
</svg>
