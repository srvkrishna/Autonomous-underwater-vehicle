<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="sonarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78c8c2" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#132d43" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f2d45" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="seaGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9ef1b" />
      <stop offset="45%" stop-color="#78c8c2" />
      <stop offset="100%" stop-color="#3d8b87" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78c8c2" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#b9ef1b" />
      <stop offset="100%" stop-color="#78c8c2" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background disk -->
  <circle cx="50" cy="50" r="47" fill="url(#sonarGlow)" stroke="#78c8c2" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Outer tick rings -->
  <circle cx="50" cy="50" r="41" stroke="#78c8c2" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2 3" />
  
  <!-- Outer sonar pulse rings -->
  <circle cx="50" cy="50" r="32" stroke="#78c8c2" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="50" cy="50" r="22" stroke="#78c8c2" stroke-width="1.4" stroke-opacity="0.65" />
  <circle cx="50" cy="50" r="12" stroke="#78c8c2" stroke-width="1.6" stroke-opacity="0.85" />

  <!-- Acoustic sweep wedge (45 deg) -->
  <path d="M 50 50 L 78 22 A 40 40 0 0 1 89 42 Z" fill="#78c8c2" fill-opacity="0.18" />

  <!-- Acoustic wave notch crossing the center -->
  <path d="M 12 50 C 24 50, 30 38, 42 38 C 54 38, 60 62, 72 62 C 80 62, 84 50, 88 50" 
        stroke="url(#waveGrad)" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Quadrant reticle crosshairs -->
  <line x1="50" y1="6" x2="50" y2="14" stroke="#78c8c2" stroke-width="1.5" />
  <line x1="50" y1="86" x2="50" y2="94" stroke="#78c8c2" stroke-width="1.5" />
  <line x1="6" y1="50" x2="14" y2="50" stroke="#78c8c2" stroke-width="1.5" />
  <line x1="86" y1="50" x2="94" y2="50" stroke="#78c8c2" stroke-width="1.5" />

  <!-- Center core emitter -->
  <circle cx="50" cy="50" r="4.5" fill="#b9ef1b" />
  <circle cx="50" cy="50" r="2" fill="#0f2d45" />
</svg>
